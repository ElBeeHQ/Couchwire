# Generate the Xcode project with: xcodegen generate
name: Couchwire
options:
  bundleIdPrefix: com.elbeehq
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64

targets:
  Couchwire:
    type: application
    platform: macOS
    sources:
      - path: Couchwire
    preBuildScripts:
      - name: Build libchiaki
        script: |
          if [ ! -f "${PROJECT_DIR}/build/chiaki/out/libchiaki_all.a" ]; then
            "${PROJECT_DIR}/scripts/build-chiaki.sh"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elbeehq.couchwire
        PRODUCT_NAME: Couchwire
        INFOPLIST_FILE: Couchwire/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Couchwire/Couchwire.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Couchwire/Core/Couchwire-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/chiaki-ng/lib/include
          - $(PROJECT_DIR)/build/chiaki/lib/include
        # Everything is static (scripts/build-deps.sh), so the app needs nothing from Homebrew.
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/build/chiaki/out
          - $(PROJECT_DIR)/build/deps/prefix/lib
        OTHER_LDFLAGS:
          - -lchiaki_all
          - -lcurl
          - -lssl
          - -lcrypto
          - -lopus
          - -ljson-c
          - -lminiupnpc
          - -levent
          - -lz
          - -framework CoreServices
          - -framework SystemConfiguration
          - -framework Security
        GCC_OPTIMIZATION_LEVEL: "3"
        SWIFT_OPTIMIZATION_LEVEL: -O
